<!DOCTYPE html>

<head>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e1a;
  --bg2: #131829;
  --bg3: #050710;
  --fire: #ff6b1a;
  --fire2: #ffb347;
  --ember: #fff3c4;
  --gold: #d4af37;
  --text: #e8ecf5;
  --muted: #8892a6;
  --border: rgba(255, 107, 26, 0.15);
  --shadow: 0 8px 32px rgba(255, 107, 26, 0.15);
}
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--fire2);
  outline-offset: 3px;
  border-radius: 6px;
}
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.ember {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--ember), var(--fire2), var(--fire));
  box-shadow: 0 0 30px var(--fire), 0 0 60px var(--fire2);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.25); opacity: 0.75; }
}
.loader-text {
  margin-top: 20px;
  color: var(--fire2);
  letter-spacing: 3px;
  font-size: 0.85rem;
  animation: fadePulse 2s ease-in-out infinite;
}
@keyframes fadePulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 14px 20px;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-brand { font-weight: 900; color: var(--fire2); font-size: 1rem; letter-spacing: 1px; }
.nav-links { display: flex; gap: 20px; font-size: 0.9rem; color: var(--muted); }
.nav-links a { transition: color 0.3s; }
.nav-links a:hover { color: var(--fire2); }
@media (max-width: 600px) { .nav-links { display: none; } }
section { padding: 70px 20px; position: relative; }
.container { max-width: 1000px; margin: 0 auto; }
h2 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  color: var(--fire2);
  text-align: center;
  margin-bottom: 36px;
  font-weight: 900;
  position: relative;
  padding-bottom: 14px;
}
h2::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 3px;
  background: linear-gradient(90deg, transparent, var(--fire), transparent);
  border-radius: 2px;
}
p { font-size: 1.02rem; margin-bottom: 14px; }
.muted { color: var(--muted); }
.hero {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 90px 20px 60px;
  position: relative;
  overflow: hidden;
  background-image: 
    linear-gradient(180deg, rgba(10,14,26,0.3) 0%, rgba(10,14,26,0.85) 100%),
    url('https://i.postimg.cc/4xyv8zPL/hero.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: scroll;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(1px 1px at 15% 25%, var(--fire2), transparent),
    radial-gradient(1px 1px at 65% 65%, var(--fire), transparent),
    radial-gradient(1px 1px at 85% 15%, var(--ember), transparent);
  background-size: 200% 200%;
  animation: sparkle 12s linear infinite;
  opacity: 0.25;
  pointer-events: none;
}
@keyframes sparkle {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}
.hero-content { position: relative; z-index: 2; max-width: 700px; }
.hero-logo {
  font-size: clamp(0.7rem, 2vw, 0.9rem);
  color: var(--muted);
  letter-spacing: 3px;
  margin-bottom: 20px;
}
.hero h1 {
  font-size: clamp(1.8rem, 6vw, 3.2rem);
  font-weight: 900;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--fire), var(--fire2), var(--ember));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
.hero .tagline {
  font-size: clamp(0.95rem, 2.5vw, 1.2rem);
  color: var(--fire2);
  letter-spacing: 2px;
  margin-bottom: 30px;
  text-shadow: 0 1px 10px rgba(0,0,0,0.6);
}
.hero .hook {
  font-size: clamp(1rem, 2.5vw, 1.15rem);
  color: var(--gold);
  font-style: italic;
  margin-bottom: 40px;
  text-shadow: 0 1px 10px rgba(0,0,0,0.6);
}
.hero-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-block;
  padding: 14px 30px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 1rem;
  transition: all 0.3s ease;
  border: 2px solid transparent;
  cursor: pointer;
  text-align: center;
}
.btn-primary {
  background: linear-gradient(135deg, var(--fire), var(--fire2));
  color: #0a0e1a;
  box-shadow: 0 8px 24px rgba(255, 107, 26, 0.5);
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(255, 107, 26, 0.7);
}
.btn-outline {
  background: rgba(10, 14, 26, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--fire2);
  border-color: var(--fire2);
}
.btn-outline:hover {
  background: rgba(255, 179, 71, 0.2);
  transform: translateY(-3px);
}
.trailer { background: var(--bg3); text-align: center; }
.trailer-wrapper {
  max-width: 800px;
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  background: radial-gradient(circle at center, #1a1f35 0%, #050710 80%);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.trailer-wrapper::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255, 107, 26, 0.18), transparent 60%);
  animation: trailerPulse 3.5s ease-in-out infinite;
}
@keyframes trailerPulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.85; transform: scale(1.06); }
}
.trailer-content { position: relative; z-index: 2; padding: 0 20px; }
.trailer-icon { font-size: 2.8rem; margin-bottom: 14px; filter: drop-shadow(0 0 20px rgba(255, 107, 26, 0.6)); }
.trailer-title { color: var(--fire2); font-weight: 900; font-size: clamp(1.1rem, 3vw, 1.5rem); margin-bottom: 8px; }
.trailer-sub { color: var(--muted); font-size: 0.9rem; font-style: italic; }
.trailer-quote { margin-top: 26px; color: var(--gold); font-style: italic; font-size: clamp(0.95rem, 2.2vw, 1.1rem); }
.why { background: var(--bg); }
.why-content { max-width: 700px; margin: 0 auto; text-align: center; }
.why blockquote {
  border-right: 3px solid var(--fire);
  padding-right: 20px;
  margin: 20px auto;
  font-style: italic;
  color: var(--fire2);
  font-size: 1.15rem;
  text-align: right;
  max-width: 500px;
}
.k404 { background: var(--bg3); }
.k404-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}
@media (max-width: 600px) { .k404-grid { grid-template-columns: 1fr; } }
.k404-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  text-align: right;
  transition: transform 0.3s, border-color 0.3s;
}
.k404-card:hover { transform: translateY(-4px); border-color: rgba(255, 107, 26, 0.5); }
.k404-card .icon { font-size: 1.8rem; margin-bottom: 12px; display: block; }
.k404-card h3 { color: var(--fire2); font-size: 1.2rem; margin-bottom: 12px; font-weight: 900; }
.k404-card p { color: var(--text); font-size: 0.98rem; line-height: 1.7; }
.k404-quote { text-align: center; margin-top: 36px; font-size: 1.15rem; color: var(--fire2); font-style: italic; }
.world { background: var(--bg); }
.world-map {
  max-width: 800px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}
.world-node {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 12px;
  text-align: center;
  transition: all 0.3s;
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
}
.world-node:hover, .world-node:focus-visible {
  transform: translateY(-3px);
  border-color: var(--fire2);
  box-shadow: var(--shadow);
}
.world-node.active { border-color: var(--fire); background: linear-gradient(135deg, rgba(255, 107, 26, 0.08), transparent); }
.world-node .icon { font-size: 1.6rem; margin-bottom: 6px; display: block; }
.world-node .name { font-weight: 700; color: var(--fire2); font-size: 0.95rem; }
.world-detail {
  max-width: 600px;
  margin: 20px auto 0;
  padding: 20px 24px;
  background: var(--bg2);
  border: 1px solid var(--fire);
  border-radius: 12px;
  text-align: center;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  padding-top: 0; padding-bottom: 0;
  transition: opacity 0.4s ease, max-height 0.4s ease, padding 0.4s ease;
}
.world-detail.visible { opacity: 1; max-height: 220px; padding-top: 20px; padding-bottom: 20px; }
.world-detail-title { color: var(--fire2); font-weight: 900; margin-bottom: 6px; }
.world-detail-text { color: var(--text); font-size: 0.95rem; font-style: italic; }
.family { background: var(--bg3); }
.family-intro { max-width: 600px; margin: 0 auto 36px; text-align: center; color: var(--muted); font-size: 0.98rem; font-style: italic; }
.family-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}
.family-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  transition: transform 0.3s, border-color 0.3s;
}
.family-card:hover { transform: translateY(-4px); border-color: var(--fire2); }
.family-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--fire), var(--fire2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}
.family-card h3 { color: var(--fire2); font-size: 1.1rem; font-weight: 900; margin-bottom: 6px; }
.family-card .role { color: var(--muted); font-size: 0.9rem; }
.family-footnote {
  max-width: 600px;
  margin: 30px auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  font-style: italic;
  padding-top: 20px;
  border-top: 1px dashed var(--border);
}
.dreams { background: var(--bg); }
.dreams-intro { max-width: 600px; margin: 0 auto 40px; text-align: center; }
.dreams-form {
  max-width: 500px;
  margin: 0 auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 24px;
}
.dreams-form label { display: block; color: var(--fire2); font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; }
.dreams-form input, .dreams-form textarea {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 18px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  transition: border-color 0.3s;
}
.dreams-form input:focus, .dreams-form textarea:focus { outline: none; border-color: var(--fire2); }
.dreams-form textarea { min-height: 120px; resize: vertical; }
.dreams-form button { width: 100%; margin-top: 8px; }
.dreams-note {
  margin-top: 22px;
  padding: 14px 16px;
  background: rgba(255, 179, 71, 0.06);
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--fire2);
  font-size: 0.9rem;
  text-align: center;
  line-height: 1.7;
}
.dreams-promise {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.9rem;
  text-align: center;
  line-height: 1.8;
}
.dreams-promise strong { color: var(--fire2); }
.production { background: var(--bg3); text-align: center; }
.production-content { max-width: 700px; margin: 0 auto; }
.production-list { display: inline-block; text-align: right; margin: 20px 0 30px; color: var(--text); }
.production-list li { list-style: none; padding: 6px 0; font-size: 1rem; }
.production-list li::before { content: '—'; color: var(--fire); margin-left: 10px; font-weight: 700; }
.production-cta { margin-top: 24px; }
.contact { background: var(--bg); text-align: center; }
.contact-content { max-width: 600px; margin: 0 auto; }
.contact-note {
  display: inline-block;
  color: var(--muted);
  font-size: 1rem;
  padding: 12px 24px;
  border: 2px dashed var(--border);
  border-radius: 50px;
  margin-top: 20px;
}
.contact-quote { margin-top: 30px; color: var(--gold); font-style: italic; }
footer {
  background: var(--bg3);
  padding: 40px 20px 30px;
  text-align: center;
  border-top: 1px solid var(--border);
}
.footer-brand { color: var(--fire2); font-weight: 900; font-size: 1.05rem; margin-bottom: 8px; }
.footer-copy { color: var(--muted); font-size: 0.85rem; }
.footer-motto { color: var(--gold); font-style: italic; margin-top: 16px; font-size: 0.95rem; }
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }
@media (max-width: 600px) {
  section { padding: 55px 18px; }
  .hero { padding: 80px 18px 50px; }
  .btn { padding: 13px 24px; font-size: 0.95rem; }
  .hero-buttons { flex-direction: column; }
  .hero-buttons .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
