
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كانون الأحلام</title>
<style>
body { background: #0d0d1a; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
h1 { color: #ff8c00; font-size: 2.5em; margin-top: 50px; }
p { color: #ccc; font-size: 1.2em; }
input { width: 80%; max-width: 500px; padding: 15px; font-size: 1.1em; border-radius: 12px; border: 1px solid #444; background: #1a1a2e; color: #fff; margin: 20px 0; }
button { padding: 15px 40px; font-size: 1.2em; border-radius: 30px; border: none; background: linear-gradient(45deg, #ff8c00, #ffb347); color: #000; cursor: pointer; font-weight: bold; }
button:hover { transform: scale(1.05); transition: 0.3s; }
#result { margin-top: 40px; }
#story { text-align: right; max-width: 600px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
#story p { color: #eee; }
img { max-width: 90%; border-radius: 15px; box-shadow: 0 0 25px rgba(255, 140, 0, 0.4); margin-top: 20px; }
</style>
</head>
<body>
<h1>🔥 كانون الأحلام</h1>
<p>اكتب حلمك... والكانون يحوّله إلى حكاية فخمة بصوت الحكواتي.</p>
<input type="text" id="dreamInput" placeholder="اكتب حلمك هنا...">
<br>
<button onclick="startDream()">✨ ابدأ حلمك</button>
<div id="result"></div>

<script>
async function startDream() {
  const dream = document.getElementById('dreamInput').value;
  const result = document.getElementById('result');
  if (!dream) { result.innerHTML = '<p style="color:red;">اكتب حلمك أولاً</p>'; return; }
  
  result.innerHTML = '<p>⏳ الكانون يحوّل حلمك إلى حكاية...</p>';
  
  try {
    const response = await fetch('/?prompt=' + encodeURIComponent(dream));
    if (!response.ok) {
      const errText = await response.text();
      throw new Error(errText);
    }
    const blob = await response.blob();
    const imageUrl = URL.createObjectURL(blob);
    
    result.innerHTML = 
      '<div id="story"><h2>📖 حكايتك:</h2><p>في ليلة من ليالي الكانون، ' + dream + '... وبدأت الحكاية.</p></div>' +
      '<img src="' + imageUrl + '" alt="حلمك">';
  } catch (e) {
    result.innerHTML = '<p style="color:red;">❌ خطأ: ' + e.message + '</p>';
  }
}
</script>
</body>
</html>
